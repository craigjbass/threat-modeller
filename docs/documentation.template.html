<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The Craig's Threat Modeller language guide — the lexical rules, the grammar, every block and attribute of .arch, .controls and .lib, the diagnostics and the canonical form." />
  <title>Documentation — Craig's Threat Modeller</title>
  <style>
    /* ============================================================
       THREAT-MODELLER DESIGN SYSTEM — canonical CSS
       Pasted verbatim into index.html and documentation.template.html
       ============================================================ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0a0a0a;
      --fg:     #e7e7e7;
      --dim:    #888888;
      --faint:  #555555;
      --green:  #9fef00;
      --red:    #ef4444;
      --border: #222222;
    }

    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    /* nav */
    .nav {
      font-size: 12px;
      color: var(--dim);
      padding: 4px 0 32px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }
    .nav a { color: var(--fg); text-decoration: none; }
    .nav a:hover { color: var(--green); }
    .sep { color: var(--faint); margin: 0 8px; }
    .nav a[aria-current="page"] { color: var(--dim); }

    /* section header */
    .sh {
      color: var(--dim);
      font-size: 12px;
      margin: 40px 0 14px;
    }

    /* document headings */
    h1, h2, h3, h4 {
      color: var(--fg);
      font-weight: normal;
      margin: 32px 0 14px;
    }
    h1 { font-size: 18px; }
    h2 { font-size: 15px; }
    h3 { font-size: 13px; }
    h4 { font-size: 13px; }
    h2::before { content: "## "; color: var(--dim); }
    h3::before { content: "### "; color: var(--dim); }

    /* prose */
    p { margin: 0 0 14px; max-width: 80ch; }
    p.lead { color: var(--fg); font-size: 15px; margin-bottom: 24px; }
    p.dim { color: var(--dim); }

    /* links */
    a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--green); }

    /* bracketed link */
    .blink {
      color: var(--fg);
      text-decoration: none;
      margin-right: 14px;
      display: inline-block;
    }
    .blink::before { content: "[ "; color: var(--dim); }
    .blink::after  { content: " ]"; color: var(--dim); }
    .blink:hover { color: var(--green); }
    .blink:hover::before, .blink:hover::after { color: var(--green); }

    /* ascii diagram */
    pre.ascii {
      color: var(--green);
      line-height: 1.4;
      margin: 0 0 18px;
      white-space: pre;
      overflow-x: auto;
      border-left: none;
      padding: 0;
    }
    pre.ascii.fg { color: var(--fg); }

    /* screenshot */
    figure.shot { margin: 0 0 24px; }
    figure.shot img {
      width: 100%;
      height: auto;
      display: block;
    }
    figure.shot figcaption {
      color: var(--dim);
      font-size: 12px;
      margin-top: 6px;
    }

    /* stats line */
    .stats {
      color: var(--fg);
      margin: 0 0 24px;
      white-space: pre;
      font-family: inherit;
      overflow-x: auto;
    }
    .k { color: var(--dim); }
    .no { color: var(--red); }

    /* numbered steps */
    ol.steps {
      list-style: none;
      counter-reset: step;
      margin: 0 0 18px;
    }
    ol.steps li {
      counter-increment: step;
      padding-left: 32px;
      position: relative;
      margin-bottom: 8px;
    }
    ol.steps li::before {
      content: counter(step) ".";
      position: absolute;
      left: 0;
      color: var(--dim);
    }

    /* bullet list */
    ul.bullets { list-style: none; margin: 0 0 18px; }
    ul.bullets > li {
      padding-left: 16px;
      position: relative;
      margin-bottom: 14px;
    }
    ul.bullets > li::before {
      content: "-";
      position: absolute;
      left: 0;
      color: var(--dim);
    }
    ul.bullets > li > .desc {
      color: var(--dim);
      display: block;
      margin-top: 2px;
    }

    /* definition list */
    dl.paths { margin: 0 0 18px; }
    dl.paths dt { color: var(--green); margin-top: 14px; }
    dl.paths dt:first-child { margin-top: 0; }
    dl.paths dd { color: var(--dim); margin: 2px 0 0; padding-left: 16px; }

    /* two column comparison */
    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin: 0 0 18px;
    }
    .compare h4 {
      margin: 0 0 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .compare ul { list-style: none; }
    .compare li {
      padding-left: 16px;
      position: relative;
      margin-bottom: 6px;
      color: var(--dim);
    }
    .compare li::before {
      content: "-";
      position: absolute;
      left: 0;
      color: var(--faint);
    }
    @media (max-width: 768px) {
      .compare { grid-template-columns: 1fr; gap: 18px; }
    }

    /* shell-prompt block */
    pre.shell {
      color: var(--fg);
      background: transparent;
      margin: 0 0 14px;
      white-space: pre;
      overflow-x: auto;
      border-left: none;
      padding: 0;
    }
    pre.shell .p { color: var(--green); }
    pre.shell .c { color: var(--dim); }

    /* inline code */
    code { color: var(--green); background: transparent; }

    /* code blocks */
    pre {
      background: transparent;
      border-left: 1px solid var(--border);
      padding: 0 0 0 14px;
      margin: 0 0 14px;
      overflow-x: auto;
      color: var(--fg);
    }
    pre code { color: inherit; }

    /* tables */
    table {
      border-collapse: collapse;
      margin: 0 0 18px;
      font-size: 13px;
      width: 100%;
    }
    th, td {
      text-align: left;
      padding: 6px 14px 6px 0;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--fg);
    }
    th { color: var(--dim); font-weight: normal; }

    /* footer */
    .foot {
      color: var(--dim);
      font-size: 12px;
      padding: 32px 0 0;
      border-top: 1px solid var(--border);
      margin-top: 48px;
    }

    /* toc */
    .toc { margin: 0 0 32px; color: var(--dim); line-height: 1.8; }
  </style>
</head>
