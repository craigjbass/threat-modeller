name: Linux

# The language and the executable must never import an Apple framework. This
# job is what enforces it: it builds and tests the package on Ubuntu, then runs
# the executable over a sample project.
#
# Every other workflow calls this one. A pull request calls it for the tests
# alone. A release calls it with build-binaries, and then carries the static
# binaries it makes.
on:
  workflow_call:
    inputs:
      build-binaries:
        description: build the static Linux binaries and upload them
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the package
        working-directory: ThreatModelKit
        run: swift build --build-tests

      - name: Run the package tests
        working-directory: ThreatModelKit
        run: swift test

      - name: Format the sample project
        working-directory: ThreatModelKit
        run: |
          mkdir -p /tmp/sample/threatmodel
          cat > /tmp/sample/threatmodel/payments.arch <<'ARCH'
          system "Payments" {
          zone "app" { kind = "private"
          component "api" { technology = "aws-ec2" } }
          }
          ARCH
          swift run threatmodeller-cli format /tmp/sample
          cat /tmp/sample/threatmodel/payments.arch

      - name: Compile, check and report the sample project
        working-directory: ThreatModelKit
        run: |
          swift run threatmodeller-cli compile /tmp/sample
          test -f /tmp/sample/threatmodel/payments.controls

          # Nothing is answered yet, so check must fail the build.
          set +e
          swift run threatmodeller-cli check /tmp/sample
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

          # Answer everything, and it must pass.
          sed -i 's/"not_implemented"/"accepted"/g' /tmp/sample/threatmodel/payments.controls
          swift run threatmodeller-cli check /tmp/sample

          swift run threatmodeller-cli report /tmp/sample
          test -f /tmp/sample/threatmodel/payments.md
          head -20 /tmp/sample/threatmodel/payments.md

      - name: Refuse a file that does not parse
        working-directory: ThreatModelKit
        run: |
          mkdir -p /tmp/broken/threatmodel
          printf 'system "P" {\n  zone "z" { kind = "secret" }\n}\n' \
            > /tmp/broken/threatmodel/p.arch
          set +e
          swift run threatmodeller-cli format /tmp/broken
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: Vendor a library, and read it
        working-directory: ThreatModelKit
        run: |
          # A library repository this job builds, so nothing reaches a network.
          mkdir -p /tmp/elements
          cat > /tmp/elements/acme.lib <<'LIB'
          library "acme" {
            name = "Acme Platform"

            technology "cribl-stream" {
              name     = "Cribl Stream"
              category = "monitoring"
              threats  = ["pipeline-tamper"]
            }

            threat "pipeline-tamper" {
              name     = "Pipeline tampering"
              severity = "high"

              control "Sign pipeline configurations"
            }
          }
          LIB
          git config --global --add safe.directory /tmp/elements
          git -C /tmp/elements init --initial-branch=main
          git -C /tmp/elements add .
          git -C /tmp/elements -c user.email=a@b.c -c user.name=A commit -m one
          git -C /tmp/elements tag v1.0.0

          # A project that names the library's technology.
          mkdir -p /tmp/library-project/threatmodel
          cat > /tmp/library-project/threatmodel/payments.arch <<'ARCH'
          system "Payments" {
            component "ingest" { technology = "acme-cribl-stream" }
          }
          ARCH

          swift run threatmodeller-cli library add /tmp/elements v1.0.0 /tmp/library-project
          test -f /tmp/library-project/threatmodel/library/acme.lib
          test -f /tmp/library-project/threatmodel/library/library.lock.json

          swift run threatmodeller-cli library verify /tmp/library-project
          swift run threatmodeller-cli library list /tmp/library-project

          # The library's threat reaches the compiled answers.
          swift run threatmodeller-cli compile /tmp/library-project
          grep -q 'acme-pipeline-tamper' /tmp/library-project/threatmodel/payments.controls
          grep -q 'Sign pipeline configurations' /tmp/library-project/threatmodel/payments.controls

          # A hand edit must fail verify.
          echo '# edited by hand' >> /tmp/library-project/threatmodel/library/acme.lib
          set +e
          swift run threatmodeller-cli library verify /tmp/library-project
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

          # update puts it back.
          swift run threatmodeller-cli library update /tmp/library-project
          swift run threatmodeller-cli library verify /tmp/library-project

          # remove refuses while the system names it.
          set +e
          swift run threatmodeller-cli library remove acme /tmp/library-project
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          swift run threatmodeller-cli library remove acme --force /tmp/library-project

      - name: Refuse a repository that is not there
        working-directory: ThreatModelKit
        run: |
          mkdir -p /tmp/no-repo/threatmodel
          printf 'system "P" { }\n' > /tmp/no-repo/threatmodel/p.arch
          set +e
          swift run threatmodeller-cli library add /no/such/repository v1.0.0 /tmp/no-repo
          code=$?
          set -e
          test "$code" -eq 4 || { echo "expected exit 4, got $code"; exit 1; }

      - name: Install the static Linux SDK
        if: ${{ inputs.build-binaries }}
        run: |
          # The Swift container carries no download tool.
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates

          # The SDK and the toolchain must be the same build, so read the tag
          # out of the toolchain rather than naming a version here.
          TAG=$(swift --version | sed -n 's/.*(\(swift-[0-9.]*-RELEASE\)).*/\1/p')
          test -n "$TAG" || { swift --version; echo "cannot read the toolchain tag"; exit 1; }

          BUNDLE="${TAG}_static-linux-0.0.1.artifactbundle.tar.gz"
          DIR=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
          URL="https://download.swift.org/${DIR}/static-sdk/${TAG}/${BUNDLE}"
          echo "$URL"

          # Installing from a local file needs no checksum on the command line.
          curl -fsSL -o "/tmp/${BUNDLE}" "$URL"
          swift sdk install "/tmp/${BUNDLE}"
          swift sdk list

      - name: Build the static Linux binaries
        if: ${{ inputs.build-binaries }}
        run: ./scripts/build-linux.sh

      - name: Prove the static binary runs with no Swift installed
        if: ${{ inputs.build-binaries }}
        run: |
          # The container that runs this holds a Swift toolchain, so a dynamic
          # binary would pass by accident. `ldd` proves the file needs nothing.
          DIR=build/linux/x86_64-swift-linux-musl
          BIN="$DIR/threatmodeller"
          ldd "$BIN" 2>&1 | grep -qi "not a dynamic executable" \
            || { echo "the binary is not static:"; ldd "$BIN"; exit 1; }

          # Run real verbs, and read the catalogue from the directory that
          # ships beside the binary.
          mkdir -p /tmp/static/threatmodel
          cat > /tmp/static/threatmodel/p.arch <<'ARCH'
          system "P" {
          zone "z" { kind = "private"
          component "c" { technology = "aws-ec2" } }
          }
          ARCH
          "$BIN" --catalogue "$DIR" format /tmp/static
          "$BIN" --catalogue "$DIR" compile /tmp/static
          test -f /tmp/static/threatmodel/p.controls

      - name: Upload the static Linux binaries
        if: ${{ inputs.build-binaries }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-binaries
          path: |
            build/linux/threatmodeller-x86_64-swift-linux-musl.tar.gz
            build/linux/threatmodeller-aarch64-swift-linux-musl.tar.gz
          if-no-files-found: error
          retention-days: 1
