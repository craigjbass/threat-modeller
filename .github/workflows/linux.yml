name: Linux

# The language and the executable must never import an Apple framework. This
# job is what enforces it: it builds and tests the package on Ubuntu, then runs
# the executable over a sample project.
#
# Every other workflow calls this one. A pull request calls it for the tests
# alone. A release calls it with build-binaries, and then carries the static
# binaries it makes.
on:
  workflow_call:
    inputs:
      build-binaries:
        description: build the static Linux binaries and upload them
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    # Pinned to a patch release, not to swift:6.2. A Swift SDK must be the same
    # build as the toolchain that uses it, and swift.org publishes an SDK per
    # patch release. swift:6.2 is 6.2.4 today, and no static SDK is published
    # for 6.2.4. Move this pin forward when one is.
    container: swift:6.2.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the package
        working-directory: ThreatModelKit
        run: swift build --build-tests

      - name: Run the package tests
        working-directory: ThreatModelKit
        run: swift test

      # The threatcl export is checked by threatcl itself. The smoke test
      # runs the binary when it is on the machine, so this step puts it there.
      # A machine without it keeps the golden test, which states the same file.
      - name: Install threatcl
        continue-on-error: true
        run: |
          VERSION=v0.6.9
          URL="https://github.com/threatcl/threatcl/releases/download/${VERSION}/threatcl_$(echo ${VERSION} | tr -d v)_linux_amd64.tar.gz"
          if curl -fsSL -o /tmp/threatcl.tar.gz "$URL"; then
            tar -xzf /tmp/threatcl.tar.gz -C /usr/local/bin threatcl
            threatcl version || true
          else
            echo "threatcl ${VERSION} could not be fetched; the golden test stands in"
          fi

      # The smoke test is a file in the repository, not shell in this file,
      # so the same run happens on a person's machine.
      - name: Run the executable over a sample project
        run: ./scripts/cli-smoke.sh

      - name: Install the static Linux SDK
        if: ${{ inputs.build-binaries }}
        run: |
          # The Swift container carries no download tool.
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates

          # The SDK and the toolchain must be the same build, so read the tag
          # out of the toolchain rather than naming a version here.
          TAG=$(swift --version | sed -n 's/.*(\(swift-[0-9.]*-RELEASE\)).*/\1/p')
          test -n "$TAG" || { swift --version; echo "cannot read the toolchain tag"; exit 1; }

          BUNDLE="${TAG}_static-linux-0.0.1.artifactbundle.tar.gz"
          DIR=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
          URL="https://download.swift.org/${DIR}/static-sdk/${TAG}/${BUNDLE}"
          echo "$URL"

          # Installing from a local file needs no checksum on the command line.
          curl -fsSL -o "/tmp/${BUNDLE}" "$URL"

          # download.swift.org answers a missing object with HTTP 200 and a
          # short XML body, so curl reports success for a file that is not
          # there. Read the first two bytes instead: a gzip file starts 1f 8b.
          MAGIC=$(head -c 2 "/tmp/${BUNDLE}" | od -An -tx1 | tr -d ' \n')
          if [ "$MAGIC" != "1f8b" ]; then
            echo "the address did not answer with an archive:"
            head -c 300 "/tmp/${BUNDLE}"
            echo
            echo "swift.org publishes a static SDK for each patch release."
            echo "This toolchain is ${TAG}. Pin the container to a release"
            echo "whose SDK is published."
            exit 1
          fi

          swift sdk install "/tmp/${BUNDLE}"
          swift sdk list

      - name: Build the static Linux binaries
        if: ${{ inputs.build-binaries }}
        run: ./scripts/build-linux.sh

      - name: Prove the static binary runs with no Swift installed
        if: ${{ inputs.build-binaries }}
        run: |
          # The container that runs this holds a Swift toolchain, so a dynamic
          # binary would pass by accident. `ldd` proves the file needs nothing.
          DIR=$(pwd)/build/linux/x86_64-swift-linux-musl
          BIN="$DIR/threatmodeller"
          ldd "$BIN" 2>&1 | grep -qi "not a dynamic executable" \
            || { echo "the binary is not static:"; ldd "$BIN"; exit 1; }

          # The same smoke test the built package runs, against the static
          # binary, reading the catalogue from the directory beside it.
          THREATMODELLER="$BIN --catalogue $DIR" ./scripts/cli-smoke.sh

      - name: Upload the static Linux binaries
        if: ${{ inputs.build-binaries }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-binaries
          path: |
            build/linux/threatmodeller-x86_64-swift-linux-musl.tar.gz
            build/linux/threatmodeller-aarch64-swift-linux-musl.tar.gz
          if-no-files-found: error
          retention-days: 1
