name: PR Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml

  test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the package
        working-directory: ThreatModelKit
        run: swift test

      - name: Test the application
        run: |
          # The runner holds no Mac Development certificate, and automatic
          # signing asks for one. The tests do not need a real identity, so
          # they sign ad hoc.
          xcodebuild test \
            -project threatmodeller.xcodeproj \
            -scheme threatmodeller \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""
