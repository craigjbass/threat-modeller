name: PR Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml

  docs-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the renderer
        run: pip install --require-hashes -r .github/workflows/pages-requirements.txt

      - name: Test the scripts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build the documentation page
        run: |
          python3 scripts/build_docs_page.py \
            --template docs/documentation.template.html \
            --source docs/LANGUAGE.md \
            --output documentation.html

      - name: Check the documentation page
        run: |
          python3 scripts/check_docs_page.py \
            --page documentation.html \
            --index docs/index.html \
            --template docs/documentation.template.html

  test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the package
        working-directory: ThreatModelKit
        run: swift test

      - name: Test the application
        run: |
          # The runner holds no Mac Development certificate, and automatic
          # signing asks for one. The tests do not need a real identity, so
          # they sign ad hoc.
          xcodebuild test \
            -project threatmodeller.xcodeproj \
            -scheme threatmodeller \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""
